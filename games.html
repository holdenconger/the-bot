<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Media Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="games-body">
    <header class="top-header">
      <div class="container nav">
        <h1>Student Media Lab</h1>
        <nav>
          <a href="index.html">Back to Learning Site</a>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h2>Games and Video Hub</h2>
      <p class="portal-note">
        Welcome to the bonus portal. Play browser games and enjoy video
        content.
      </p>

      <section class="section">
        <h3>AZ Games Embed</h3>
        <div class="embed-wrap">
          <iframe
            src="https://www.azgames.io/"
            title="AZ Games"
            loading="lazy"
            allowfullscreen
          ></iframe>
        </div>
        <p class="small-note">
          If the game embed does not load in your browser, open
          <a href="https://www.azgames.io/" target="_blank" rel="noreferrer"
            >AZ Games</a
          >
          directly.
        </p>
      </section>

      <section class="section">
        <h3>Video Library</h3>
        <div class="video-grid">
          <iframe
            src="https://www.youtube.com/embed/kJQP7kiw5Fk"
            title="Video 1"
            loading="lazy"
            allowfullscreen
          ></iframe>
          <iframe
            src="https://www.youtube.com/embed/Zi_XLOBDo_Y"
            title="Video 2"
            loading="lazy"
            allowfullscreen
          ></iframe>
          <iframe
            src="https://www.youtube.com/embed/2Vv-BfVoq4g"
            title="Video 3"
            loading="lazy"
            allowfullscreen
          ></iframe>

            src="https://www.youtube.com/embed/9bZkp7q19f0"
            title="Video 4"

            allowfullscreen
          ></iframe>
          <iframe

            title="Video 5"

            allowfullscreen
          ></iframe>
          <iframe
            src="https://www.youtube.com/embed/fRh_vgS2dFE"
            title="Video 6"
            loading="lazy"
            allowfullscreen
          ></iframe>
          <iframe
            src="https://www.youtube.com/embed/3tmd-ClpJxA"
            title="Video 7"
            loading="lazy"
            allowfullscreen
          ></iframe>
          <iframe
            src="https://www.youtube.com/embed/RgKAFK5djSk"
            title="Video 8"
            loading="lazy"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Media Lab Access — BrightPath Academy</p>
    </footer>

</html>
